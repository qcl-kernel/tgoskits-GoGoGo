<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-label="RTBENCH 网络探针握手协议：app guest 监听器等 trigger，RTOS 发 trigger 并等 READY，随后逐序列探针与 ACK，最后 DONE 完成会话">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .lbl { font: 12px sans-serif; fill: currentColor; }
    .sm  { font: 11px sans-serif; fill: currentColor; }
    .dim { font: 10.5px sans-serif; fill: currentColor; opacity: 0.7; }
    .ln  { stroke: currentColor; stroke-width: 1.3; fill: none; }
    .msg { stroke: #0d7a3f; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .msg2{ stroke: #b45309; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .m   { font: 11px sans-serif; fill: #0d7a3f; }
    .m2  { font: 11px sans-serif; fill: #b45309; }
  </style>

  <!-- 两条生命线 -->
  <line class="ln" x1="200" y1="56" x2="200" y2="300"/>
  <line class="ln" x1="660" y1="56" x2="660" y2="300"/>
  <rect class="ln" fill="none" x="120" y="20" width="160" height="34" rx="4"/>
  <text class="lbl" x="146" y="42">App guest</text>
  <rect class="ln" fill="none" x="560" y="20" width="200" height="34" rx="4"/>
  <text class="lbl" x="578" y="42">RTOS guest</text>
  <text class="dim" x="140" y="72">探针监听器 :9879</text>
  <text class="dim" x="588" y="72">RTBench net_event_latency</text>

  <!-- 时序消息 -->
  <!-- trigger（重试直到 READY）-->
  <path class="msg" d="M 660 100 L 204 100"/>
  <text class="m" x="380" y="93">① TRIGGER {magic, expected}（每 100 ms 重试）</text>

  <!-- READY -->
  <path class="msg2" d="M 200 140 L 656 140"/>
  <text class="m2" x="392" y="133">② READY {magic, 0xFFFFFFFF}</text>

  <!-- echo READY 确认 -->
  <path class="msg" d="M 660 168 L 204 168"/>
  <text class="m" x="420" y="161">②′ echo（确认 READY）</text>

  <!-- 探针序列 -->
  <path class="msg" d="M 200 208 L 656 208"/>
  <text class="m" x="352" y="201">③ PROBE seq=0..N−1 {magic, seq}（2 ms 间隔）</text>
  <path class="msg2" d="M 660 236 L 204 236"/>
  <text class="m2" x="426" y="229">④ ACK {magic, seq}（逐包）</text>

  <!-- DONE -->
  <path class="msg" d="M 660 276 L 204 276"/>
  <text class="m" x="430" y="269">⑤ DONE {magic, 0xFFFFFFFD}（benchmark 结束）</text>

  <!-- 测量窗口标注 -->
  <path class="ln" stroke-dasharray="4 4" opacity="0.55" d="M 700 208 L 760 208 L 760 236 L 700 236"/>
  <text class="dim" x="712" y="196">延迟样本 =</text>
  <text class="dim" x="712" y="228">PROBE→ACK</text>
  <text class="dim" x="712" y="246">处理耗时</text>

  <!-- 关键约束注释 -->
  <text class="dim" x="60" y="310">探针监听器走完后 app guest init 才打印组合终态 marker —— 板级串口门禁依赖此握手完整闭合</text>
</svg>
