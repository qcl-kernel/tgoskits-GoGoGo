# U-Boot serial config for the ROCK 4D on-board rtbench comparison legs.
# Same board loop as rock-4d-uboot-local.toml, but gated on the benchmark
# completion marker with a longer timeout (30s settle + 300s run + boot).
serial = "/dev/ttyUSB0"
baud_rate = "1500000"
dtb_file = "os/StarryOS/configs/board/rock-4d.dtb"

board_reset_cmd = "sg2002-ctl 1; sleep 3; rk3576-rst"
board_power_off_cmd = "sg2002-ctl 0"

success_regex = ["RTBENCH_STABILITY_DONE"]
fail_regex = [
  "panicked at",
]
timeout = 600

[net]
interface = "wlan0"
board_ip = "192.168.1.213"
gatewayip = "192.168.1.1"
netmask = "255.255.255.0"
tftp_dir = "/srv/tftp"
