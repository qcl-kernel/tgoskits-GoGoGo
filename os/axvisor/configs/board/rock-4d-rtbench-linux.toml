# Axvisor build config: ROCK 4D on-board real-time comparison, LEG B
# (Linux co-tenant + auto-benchmark RT-Thread guest).
features = []
log = "Info"
max_cpu_num = 8
target = "aarch64-unknown-none-softfloat"
vm_configs = [
  "os/axvisor/configs/vms/rock-4d/linux-net.toml",
  "os/axvisor/configs/vms/rock-4d/rtthread-auto.toml",
]
