# Axvisor build config: ROCK 4D board task123 Linux leg — Linux client +
# RT-Thread server peer over the internal virtio-net switch.
features = []
log = "Info"
max_cpu_num = 8
target = "aarch64-unknown-none-softfloat"
vm_configs = [
  "os/axvisor/configs/vms/rock-4d/linux-task123.toml",
  "os/axvisor/configs/vms/rock-4d/rtthread-auto.toml",
]
