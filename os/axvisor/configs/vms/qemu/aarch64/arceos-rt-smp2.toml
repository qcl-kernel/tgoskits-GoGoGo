# Vm base info configs
#
[base]
# Guest vm id.
id = 2
# Guest vm name.
name = "arceos-qemu-rt"
# Virtualization type.
vm_type = 1
# The number of virtual CPUs.
cpu_num = 2
# Guest vm physical cpu ids — each vCPU pinned to one host CPU.
phys_cpu_ids = [0, 1]

#
# Real-time scheduling configuration
#
[scheduling]
enabled = true
base_timeslice_us = 500
reserved_cpus = [0, 1]
disable_housekeeping = true

# vCPU 0: highest priority, short timeslice
[[scheduling.vcpu_configs]]
policy = "fixed_priority"
priority = 0
max_timeslice_us = 200
preemptive = true

# vCPU 1: medium priority, longer timeslice
[[scheduling.vcpu_configs]]
policy = "fixed_priority"
priority = 10
max_timeslice_us = 1000
preemptive = true

#
# Vm kernel configs
#
[kernel]
# The entry point of the kernel image.
entry_point = 0x8020_0000
# The location of image: "memory" | "fs".
# load from memory.
image_location = "memory"
# The file path of the kernel image.
kernel_path = "path/arceos-aarch64-dyn-smp2.bin"
# The load address of the kernel image.
kernel_load_addr = 0x8020_0000
# The file path of the device tree blob (DTB).
# dtb_path = "path/aarch64-qemu-gicv3.dtb"
# The load address of the device tree blob (DTB).
dtb_load_addr = 0x8000_0000

## The file path of the ramdisk image.
# ramdisk_path = ""
## The load address of the ramdisk image.
# ramdisk_load_addr = 0
## The path of the disk image.
# disk_path = "disk.img"

# Memory regions with format (`base_paddr`, `size`, `flags`, `map_type`).
# For `map_type`, 0 means `MAP_ALLOC`, 1 means `MAP_IDENTICAL`, 2 means `MAP_RESERVED`.
memory_regions = [
  [0x8000_0000, 0x4000_0000, 0x7, 1], # System RAM 1G MAP_IDENTICAL
]

#
# Device specifications
#
[devices]
# The interrupt mode.
interrupt_mode = "passthrough"

# Pass-through devices.
passthrough_devices = [
  ["/",],
]

# Passthrough addresses.
# Base-GPA  Length.
passthrough_addresses = [
    #[0x28041000, 0x100_0000]
]

# Devices that are not desired to be passed through to the guest
excluded_devices = [
    ["/pcie@10000000"],
]

# Emu_devices.
# Name Base-Ipa Ipa_len Alloc-Irq Emu-Type EmuConfig.
emu_devices = [
  # ["gppt-gicd", 0x0800_0000, 0x1_0000, 0, 0x21, []],
  # ["gppt-gicr", 0x080a_0000, 0x2_0000, 0, 0x20, [1, 0x2_0000, 0]], # 1 vcpu, stride 0x20000, starts with pcpu 0
  # ["gppt-gits", 0x0808_0000, 0x2_0000, 0, 0x22, [0x0808_0000]], # host_gits_base
]
