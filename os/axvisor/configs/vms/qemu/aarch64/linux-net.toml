[base]
id = 1
name = "linux-net"
vm_type = 1
cpu_num = 2
phys_cpu_ids = [0, 1]
host_timer_policy = "periodic"

[kernel]
entry_point = 0x8020_0000
image_location = "memory"
kernel_path = "/path/to/qemu-aarch64-linux"
kernel_load_addr = 0x8020_0000
dtb_load_addr = 0x8f00_0000
ramdisk_path = "/path/to/linux-net-initramfs.cpio"
ramdisk_load_addr = 0x8c00_0000
memory_regions = [
  [0x8000_0000, 0x2000_0000, 0x7, 2],
]

[devices]
interrupt_mode = "passthrough"
passthrough_devices = [
  ["/intc@8000000"],
  ["/timer"],
  ["/psci"],
  ["/pl011@9000000"],
  ["/virtio_mmio@a000000"],
]
passthrough_addresses = []
excluded_devices = []
emu_devices = [
  ["gppt-gicd", 0x0800_0000, 0x1_0000, 0, 0x21, []],
  ["gppt-gicr", 0x080a_0000, 0x4_0000, 0, 0x20, [2, 0x2_0000, 0]],
]
