# ROCK 4D board VM config: Linux co-tenant for the on-board real-time
# comparison. Mirrors the QEMU two-guest linux-net.toml payload (Alpine
# 6.12.21 + task3 initramfs) but pins the two vCPUs to big Cortex-A72 cores
# (mpidr 0x100/0x101).
[base]
id = 1
name = "linux-net"
guest_type = "virtualized"
cpu_num = 2
host_timer_policy = "periodic"
guest_tlbi_policy = "vm_scoped"
phys_cpu_ids = [0x100, 0x101]

[kernel]
entry_point = 0x8020_0000
image_location = "memory"
kernel_path = "/home/yfblock/Code/tgoskits-GoGoGo/tmp/source-cache/task3-alpine-linux/6.12.21-alpine-3.23.0/images/linux/Image"
kernel_load_addr = 0x8020_0000
dtb_load_addr = 0x8f00_0000
ramdisk_path = "/home/yfblock/Code/tgoskits-GoGoGo/tmp/source-cache/task3-alpine-linux/6.12.21-alpine-3.23.0/images/linux/rootfs.cpio.gz"
ramdisk_load_addr = 0x8c00_0000
cmdline = "console=ttyS0,1500000n8 earlycon=uart8250,mmio32,0x2ad40000 rdinit=/init"
memory_regions = [
  [0x8000_0000, 0x2000_0000, 0x7, 2],
]

[devices]
passthrough = []
disabled = []

[[devices.virtual]]
id = "net0"
model = "virtio-net"
guest_mac = [0x52, 0x54, 0x00, 0x77, 0x00, 0x01]
