# ROCK 4D board VM config: Linux Task123 application guest.
[base]
id = 1
name = "linux-task123"
guest_type = "virtualized"
cpu_num = 2
host_timer_policy = "periodic"
guest_tlbi_policy = "vm_scoped"
phys_cpu_ids = [0x100, 0x101]

[kernel]
entry_point = 0x8020_0000
image_location = "memory"
kernel_path = "${workspace}/tmp/source-cache/task3-alpine-linux/6.12.21-alpine-3.23.0/images/linux/Image"
kernel_load_addr = 0x8020_0000
dtb_load_addr = 0x8f00_0000
ramdisk_path = "${workspace}/tmp/source-cache/task3-alpine-linux/6.12.21-alpine-3.23.0/images/linux/rootfs.cpio.gz"
ramdisk_load_addr = 0x8c00_0000
cmdline = "console=ttyS0,1500000n8 earlycon=uart8250,mmio32,0x2ad40000 rdinit=/init task2.count=10 task3.frames=3 task3.fault=normal rtbench.net.count=10"
memory_regions = [
  [0x8000_0000, 0x2000_0000, 0x7, 2],
]

[devices]
passthrough = []
disabled = []

[[devices.virtual]]
id = "net0"
model = "virtio-net"
guest_mac = [0x52, 0x54, 0x00, 0x77, 0x00, 0x01]
