# ROCK 4D board VM config: Zephyr Task123 RTOS guest.
# The image is generated by build_zephyr_task123.sh before Axvisor builds.
[base]
id = 3
name = "zephyr-task123-rock4d"
guest_type = "virtualized"
cpu_num = 1
host_timer_policy = "periodic"
host_vcpu_idle_policy = "busy"
phys_cpu_ids = [0x102]

[kernel]
entry_point = 0x4000_1104
image_location = "memory"
kernel_path = "${workspace}/tmp/source-cache/zephyr/dccb09599635bdff17633fa7e9dab014b91dce90/current-image/current/zephyr.bin"
kernel_load_addr = 0x4000_0000
load_policy = "keep_configured"
dtb_load_addr = 0x47e0_0000
cmdline = "task3.fault=normal"
memory_regions = [
  [0x4000_0000, 0x0800_0000, 0x7, 0],
]

[devices]
passthrough = []
disabled = []

[[devices.virtual]]
id = "net0"
model = "virtio-net"
guest_mac = [0x52, 0x54, 0x00, 0x77, 0x00, 0x03]
