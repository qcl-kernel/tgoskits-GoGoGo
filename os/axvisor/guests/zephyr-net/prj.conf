CONFIG_PRINTK=y
CONFIG_LOG=n

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_ARP=y
CONFIG_NET_TCP=y
CONFIG_NET_QEMU_ETHERNET=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_ETH_NET_IF_NO_AUTO_START=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
CONFIG_STATIC_INIT_GNU=y
CONFIG_HEAP_MEM_POOL_SIZE=131072

CONFIG_VIRTIO=y
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_PCI=n
CONFIG_ETH_VIRTIO_NET=y
CONFIG_ETH_VIRTIO_NET_RX_BUFFERS=8
CONFIG_ETH_E1000=n
CONFIG_PCIE=n

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# Keep this guest independent of the host libc and POSIX sockets.
CONFIG_MINIMAL_LIBC=y
CONFIG_POSIX_API=n
CONFIG_NET_SOCKETS=n

# Axvisor enters this guest at EL1 Non-secure; configure GIC SGI/PPI as Group 1.
CONFIG_ARMV8_A_NS=y
