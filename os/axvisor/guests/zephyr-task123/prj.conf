CONFIG_MINIMAL_LIBC=y
CONFIG_POSIX_API=n
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=393216
CONFIG_PRINTK=y
CONFIG_LOG=n
CONFIG_BOOTARGS=n
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="uart:~$ "
CONFIG_SHELL_HELP=n

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_QEMU_ETHERNET=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_ETH_NET_IF_NO_AUTO_START=y
CONFIG_NET_PKT_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=96
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_VIRTIO=y
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_PCI=n
CONFIG_ETH_VIRTIO_NET=y
CONFIG_ETH_VIRTIO_NET_RX_BUFFERS=16
CONFIG_ETH_E1000=n
CONFIG_PCIE=n

CONFIG_ARMV8_A_NS=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
CONFIG_STATIC_INIT_GNU=y
CONFIG_TIMESLICE_SIZE=0
